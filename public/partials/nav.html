    <!--
      等級。他自己問的：「怎麼沒看到等級？不是說幾級才能解鎖？」

      在此之前等級只存在於戰鬥畫面的 HUD 裡——商店寫著「10 級解鎖」，
      而他在遊戲外面找不到任何地方知道自己幾級。鎖住裝備的門檻要看得到，
      門檻旁邊那個「我現在在哪」也要看得到，不然那個數字沒有意義。
    -->
    <span class="level-badge" data-nav-level hidden>Lv 1</span>
    <!--
      暱稱按鈕。共用裝置上「現在是誰在玩」要一直看得到，所以名字常駐。

      原本點一下就直接跳回選單，但它長得像一個顯示狀態的標籤，
      提示只寫在 title 裡（滑鼠停上去才看得到，平板上根本看不到）——
      結果就是沒有人知道那是可以按的，想換帳號只好自己去找首頁網址。
      改成明確的選單：右邊多一個 ▾，點開有「換人玩」與「登出」。
    -->
    <div class="nav-user" data-nav-user>
      <button class="nav-user-btn" data-nav-switch type="button" aria-haspopup="true" aria-expanded="false">
        👤<span data-nav-nickname></span><span class="nav-user-caret">▾</span>
      </button>
      <div class="nav-user-menu" data-nav-user-menu hidden>
        <p class="nav-user-menu-head">目前是 <strong data-nav-nickname-menu></strong></p>
        <button type="button" data-nav-switch-account>🔄 換人玩</button>
        <button type="button" data-nav-logout>🚪 登出</button>
      </div>
    </div>
