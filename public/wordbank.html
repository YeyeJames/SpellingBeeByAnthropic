<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>單字庫 - 拼字蜂</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/wordbank.css" />
  <!-- modulepreload:start 由 npm run gen-preload 產生，請勿手動編輯 -->
  <link rel="modulepreload" href="/js/wordbank.js" />
  <link rel="modulepreload" href="/js/api.js" />
  <link rel="modulepreload" href="/js/ui-status.js" />
  <link rel="modulepreload" href="/js/auth.js" />
  <link rel="modulepreload" href="/js/theme.js" />
  <link rel="modulepreload" href="/js/local-store.js" />
  <link rel="modulepreload" href="/js/nav-partial.js" />
  <link rel="modulepreload" href="/js/outbox.js" />
  <link rel="modulepreload" href="/js/sound-manager.js" />
  <link rel="modulepreload" href="/js/audio-player.js" />
  <link rel="modulepreload" href="/js/recorder.js" />
  <!-- modulepreload:end -->
</head>
<body data-theme="sports" class="page-loading">
  <div data-nav-mount></div>

  <div class="container">
    <div class="panel container">
      <div class="wb-header">
        <h1>📚 單字庫</h1>
        <span class="wb-count" id="wb-count"></span>
      </div>

      <div class="wb-filters">
        <div class="wb-part-tabs" id="part-tabs"></div>
        <input type="text" id="search-input" placeholder="搜尋英文或中文..." />
      </div>

      <p class="error-text" id="list-error"></p>
      <div id="word-list" class="word-list"></div>
    </div>
  </div>

  <!-- 錄音面板：單字內容不可修改，只能替它錄真人發音 -->
  <div id="record-overlay" class="wb-overlay hidden">
    <div class="panel wb-form-panel">
      <h2 id="record-title">錄音</h2>
      <p class="wb-audio-status" id="audio-status"></p>
      <div class="wb-audio-buttons">
        <button type="button" class="btn secondary" id="btn-play-preview">🔊 試聽</button>
        <button type="button" class="btn" id="btn-record">🎙️ 錄音（5秒）</button>
        <button type="button" class="btn secondary hidden" id="btn-remove-audio">🗑️ 改回語音朗讀</button>
      </div>
      <p class="error-text" id="audio-error"></p>
      <div class="wb-form-actions">
        <button type="button" class="btn secondary" id="btn-close-record">關閉</button>
        <button type="button" class="btn gold hidden" id="btn-save-record">儲存錄音</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/wordbank.js"></script>
  <script>
    // 保險：萬一 JS 模組完全載入失敗，仍要把內容顯示出來，避免永遠卡在載入畫面
    /* page-loading-failsafe */
    setTimeout(function () { document.body.classList.remove("page-loading"); }, 30000);
  </script>
</body>
</html>
