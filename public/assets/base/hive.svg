<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 170" width="150" height="170">
  <defs>
    <linearGradient id="tier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c10"/>
      <stop offset="55%" stop-color="#1d1707"/>
      <stop offset="100%" stop-color="#0d0b04"/>
    </linearGradient>
    <radialGradient id="door" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#c8790a"/>
    </radialGradient>
    <filter id="warm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 暖色輝光：這是要保護的東西，光要從裡面透出來 -->
  <g filter="url(#warm)" opacity="0.55">
    <ellipse cx="75" cy="96" rx="62" ry="62" fill="#f5b301"/>
  </g>

  <!-- 四層堆疊，越下面越寬 -->
  <g stroke="#f5b301" stroke-width="5">
    <ellipse cx="75" cy="40" rx="30" ry="18" fill="url(#tier)"/>
    <ellipse cx="75" cy="66" rx="44" ry="22" fill="url(#tier)"/>
    <ellipse cx="75" cy="99" rx="50" ry="24" fill="url(#tier)"/>
    <ellipse cx="75" cy="130" rx="57" ry="26" fill="url(#tier)"/>
  </g>

  <!-- 蜂巢格紋（右上受光面） -->
  <g fill="none" stroke="#f5b301" stroke-width="2.2" opacity="0.45">
    <path d="M92 58 l9 5 v10 l-9 5 -9-5 v-10 z"/>
    <path d="M110 90 l9 5 v10 l-9 5 -9-5 v-10 z"/>
    <path d="M92 122 l9 5 v10 l-9 5 -9-5 v-10 z"/>
  </g>

  <!-- 入口：六角形，裡面透出蜂蜜色的光 -->
  <g filter="url(#warm)" opacity="0.85">
    <circle cx="60" cy="112" r="17" fill="#ffd166"/>
  </g>
  <path d="M60 96 l15 8 v17 l-15 8 -15-8 v-17 z" fill="url(#door)" stroke="#fff3c4" stroke-width="3"/>

  <!-- 頂上的小掛勾 -->
  <path d="M75 22 L75 12" stroke="#f5b301" stroke-width="5" stroke-linecap="round"/>
</svg>
