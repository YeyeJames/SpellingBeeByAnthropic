<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <!-- 中王二・黃蜂女王：粉紅霓虹、皇冠、大翅膀、長長的針 -->
  <defs>
    <radialGradient id="w-body" cx="40%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#3a3060"/><stop offset="60%" stop-color="#1c1838"/><stop offset="100%" stop-color="#0b0a18"/>
    </radialGradient>
    <radialGradient id="w-eye" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fffdf2"/><stop offset="45%" stop-color="#ffd166"/><stop offset="100%" stop-color="#e08a0c"/>
    </radialGradient>
    <linearGradient id="w-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.9"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="w-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
    <filter id="w-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <g filter="url(#w-glow)" opacity="0.55"><ellipse cx="160" cy="118" rx="104" ry="62" fill="#f472b6"/></g>
  <!-- 翅膀（兩對） -->
  <ellipse cx="150" cy="44" rx="64" ry="26" transform="rotate(-18 150 44)" fill="url(#w-wing)" stroke="#f9a8d4" stroke-width="3"/>
  <ellipse cx="186" cy="56" rx="52" ry="22" transform="rotate(-8 186 56)" fill="url(#w-wing)" stroke="#f9a8d4" stroke-width="3"/>
  <!-- 腳 -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#f472b6" stroke-width="14"><path d="M108 150 L96 182"/><path d="M150 156 L148 190"/><path d="M190 152 L204 184"/></g>
    <g stroke="#10162a" stroke-width="7"><path d="M108 150 L96 182"/><path d="M150 156 L148 190"/><path d="M190 152 L204 184"/></g>
  </g>
  <!-- 腹部條紋 -->
  <ellipse cx="180" cy="118" rx="80" ry="46" fill="url(#w-body)" stroke="#f472b6" stroke-width="8"/>
  <g fill="#ffd166"><path d="M146 76 Q156 118 146 160 L164 164 Q174 118 164 74 Z"/><path d="M190 74 Q200 118 190 162 L208 158 Q216 118 208 78 Z"/><path d="M230 86 Q238 118 230 150 L242 140 Q248 118 242 96 Z"/></g>
  <!-- 針 -->
  <path d="M256 112 L278 120 L256 128 Z" fill="#fde68a" stroke="#f472b6" stroke-width="4" stroke-linejoin="round"/>
  <!-- 頭 -->
  <circle cx="82" cy="110" r="44" fill="url(#w-body)" stroke="#f472b6" stroke-width="8"/>
  <!-- 觸角 -->
  <path d="M66 70 Q52 40 34 34 M92 68 Q96 38 112 28" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="34" cy="34" r="6" fill="#ffd166"/><circle cx="112" cy="28" r="6" fill="#ffd166"/>
  <!-- 皇冠 -->
  <path d="M54 74 L60 46 L72 64 L82 40 L92 64 L104 46 L110 74 Z" fill="url(#w-gold)" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="82" cy="62" r="5" fill="#f472b6"/>
  <!-- 眼睛（細長、冷冷的） -->
  <ellipse cx="66" cy="112" rx="14" ry="11" fill="url(#w-eye)"/><ellipse cx="96" cy="112" rx="14" ry="11" fill="url(#w-eye)"/>
  <circle cx="63" cy="109" r="4" fill="#fff"/><circle cx="93" cy="109" r="4" fill="#fff"/>
  <path d="M50 98 L78 104 M112 98 L86 104" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <path d="M68 136 Q82 128 96 136" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-linecap="round"/>
</svg>
