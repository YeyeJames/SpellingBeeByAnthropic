<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <defs>
    <radialGradient id="body" cx="36%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#2c3757"/>
      <stop offset="58%" stop-color="#161d33"/>
      <stop offset="100%" stop-color="#0a0d17"/>
    </radialGradient>
    <radialGradient id="eye" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="45%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e08a0c"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe2ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8fb7ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- 紅色輝光 -->
  <g filter="url(#glow)" opacity="0.5">
    <ellipse cx="116" cy="66" rx="72" ry="48" fill="#ff2d2d"/>
    <circle cx="44" cy="78" r="30" fill="#ff2d2d"/>
  </g>

  <!-- 六隻短粗腳 -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#ff5d5d" stroke-width="15">
      <path d="M68 102 L54 124 L40 130"/><path d="M110 110 L106 130 L94 136"/>
      <path d="M152 104 L164 126 L178 132"/>
    </g>
    <g stroke="#10162a" stroke-width="8">
      <path d="M68 102 L54 124 L40 130"/><path d="M110 110 L106 130 L94 136"/>
      <path d="M152 104 L164 126 L178 132"/>
    </g>
  </g>

  <!-- 兩根短角 -->
  <g stroke-linecap="round" fill="none">
    <path d="M34 62 L6 50 M20 55 L10 66" stroke="#ff5d5d" stroke-width="16"/>
    <path d="M34 62 L6 50 M20 55 L10 66" stroke="#10162a" stroke-width="8"/>
  </g>

  <!-- 殼：一整塊寬圓 -->
  <ellipse cx="116" cy="66" rx="72" ry="48" fill="url(#body)" stroke="#ff5d5d" stroke-width="6"/>
  <path d="M116 18 L116 114" stroke="#ff5d5d" stroke-width="4" opacity="0.7"/>
  <path d="M72 36 Q116 20 162 38 Q120 46 84 52 Z" fill="#33406a" opacity="0.7"/>

  <!-- 頭 -->
  <circle cx="44" cy="78" r="30" fill="url(#body)" stroke="#ff5d5d" stroke-width="6"/>
  <!-- 大眼睛 + 兇眉 -->
  <ellipse cx="36" cy="78" rx="14" ry="15" fill="url(#eye)"/>
  <circle cx="31" cy="73" r="4.5" fill="#fffdf2"/>
  <path d="M20 62 L44 70" stroke="#10162a" stroke-width="7" stroke-linecap="round"/>
</svg>
