<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150">
  <defs>
    <radialGradient id="body" cx="36%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#2c3757"/>
      <stop offset="58%" stop-color="#161d33"/>
      <stop offset="100%" stop-color="#0a0d17"/>
    </radialGradient>
    <radialGradient id="eye" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="45%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e08a0c"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe2ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8fb7ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#glow)" opacity="0.5">
    <ellipse cx="140" cy="70" rx="58" ry="52" fill="#ff2d2d"/>
    <circle cx="70" cy="76" r="34" fill="#ff2d2d"/>
  </g>

  <!-- 八隻長腳：兩段式，關節朝上 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g stroke="#ff5d5d" stroke-width="13">
      <path d="M104 48 L74 20 L44 26"/><path d="M100 64 L60 46 L28 52"/>
      <path d="M100 94 L62 108 L32 114"/><path d="M104 108 L78 132 L52 140"/>
      <path d="M170 56 L198 24 L214 38"/><path d="M178 72 L210 58 L216 74"/>
      <path d="M176 90 L206 104 L212 118"/><path d="M166 102 L188 126 L178 140"/>
    </g>
    <g stroke="#10162a" stroke-width="6">
      <path d="M104 48 L74 20 L44 26"/><path d="M100 64 L60 46 L28 52"/>
      <path d="M100 94 L62 108 L32 114"/><path d="M104 108 L78 132 L52 140"/>
      <path d="M170 56 L198 24 L214 38"/><path d="M178 72 L210 58 L216 74"/>
      <path d="M176 90 L206 104 L212 118"/><path d="M166 102 L188 126 L178 140"/>
    </g>
  </g>

  <!-- 腹部 -->
  <ellipse cx="140" cy="70" rx="58" ry="52" fill="url(#body)" stroke="#ff5d5d" stroke-width="6"/>
  <path d="M104 36 Q140 22 178 40 Q142 50 112 56 Z" fill="#33406a" opacity="0.6"/>
  <!-- 頭胸 -->
  <circle cx="70" cy="76" r="34" fill="url(#body)" stroke="#ff5d5d" stroke-width="6"/>
  <!-- 四顆眼睛：兩大兩小 -->
  <ellipse cx="56" cy="70" rx="13" ry="14" fill="url(#eye)"/>
  <ellipse cx="74" cy="64" rx="9" ry="10" fill="url(#eye)" opacity="0.9"/>
  <circle cx="54" cy="86" r="5.5" fill="url(#eye)" opacity="0.75"/>
  <circle cx="72" cy="84" r="4.5" fill="url(#eye)" opacity="0.65"/>
  <circle cx="51" cy="65" r="4.5" fill="#fffdf2"/>
  <!-- 螯牙 -->
  <g stroke-linecap="round" fill="none">
    <path d="M44 96 L30 108" stroke="#ff5d5d" stroke-width="11"/>
    <path d="M44 96 L30 108" stroke="#10162a" stroke-width="5"/>
  </g>
</svg>
