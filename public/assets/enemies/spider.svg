<?xml version="1.0" encoding="UTF-8"?>
<!--
  蜘蛛：長單字（8 個字母以上）的敵人。

  最大一隻，八隻腳張開佔滿畫面——讀起來就是「這隻要打很久」。
  時間公式本來就給長字更多秒數，外形要讓他一眼看出來。
  換圖插槽：覆蓋同名檔案即可，尺寸維持 128×88。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 88" width="128" height="88">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 八隻腳：左右各四，有關節 -->
    <g stroke="#7f3d3d" stroke-width="3.2">
      <path d="M50 40 L28 20 L12 28 M52 46 L26 36 L8 44"/>
      <path d="M52 52 L26 60 L10 56 M50 58 L30 74 L16 72"/>
      <path d="M78 40 L100 20 L116 28 M76 46 L102 36 L120 44"/>
      <path d="M76 52 L102 60 L118 56 M78 58 L98 74 L112 72"/>
    </g>
    <!-- 腹部 -->
    <ellipse cx="78" cy="48" rx="26" ry="22" fill="#0e1220" stroke="#ff5d5d" stroke-width="3"/>
    <path d="M78 28 L78 70 M60 40 Q78 46 96 40" stroke="#ff8a8a" stroke-width="1.8" opacity="0.45"/>
    <!-- 頭胸 -->
    <ellipse cx="46" cy="48" rx="18" ry="16" fill="#161c2e" stroke="#ff5d5d" stroke-width="2.8"/>
    <!-- 四顆眼睛 -->
    <circle cx="36" cy="43" r="3.2" fill="#ffd166"/>
    <circle cx="36" cy="53" r="2.4" fill="#ffd166" opacity="0.8"/>
    <circle cx="44" cy="40" r="2.2" fill="#ffd166" opacity="0.7"/>
    <circle cx="44" cy="56" r="2" fill="#ffd166" opacity="0.6"/>
    <!-- 螯牙 -->
    <path d="M30 50 L20 56 M30 46 L20 40" stroke="#ff5d5d" stroke-width="2.6"/>
  </g>
</svg>
