<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拼字蜂 Spelling Bee</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <!-- modulepreload:start 由 npm run gen-preload 產生，請勿手動編輯 -->
  <link rel="modulepreload" href="/js/login.js" />
  <link rel="modulepreload" href="/js/api.js" />
  <link rel="modulepreload" href="/js/ui-status.js" />
  <link rel="modulepreload" href="/js/auth.js" />
  <link rel="modulepreload" href="/js/theme.js" />
  <link rel="modulepreload" href="/js/local-store.js" />
  <!-- modulepreload:end -->
</head>
<body data-theme="sports" class="page-loading">
  <div class="center-column">
    <div class="panel container" style="max-width: 480px;">
      <h1 class="display-font" style="text-align:center; color: var(--color-primary);">🐝 拼字蜂</h1>
      <p style="text-align:center; color: var(--color-text-muted);">選一個帳號開始練習！</p>

      <div id="profile-step">
        <div id="profile-grid" class="profile-grid">
          <!-- 動態填入 profile tiles -->
        </div>
        <p class="error-text" id="profile-error"></p>
        <div style="display:flex; gap:0.75rem; margin-top:1rem; justify-content:center;">
          <button class="btn secondary" id="manage-toggle" type="button">管理帳號</button>
        </div>
        <p id="logged-in-hint" class="hidden" style="text-align:center; font-size:0.85rem; color:var(--color-text-muted);">
          目前登入：<strong id="logged-in-name"></strong>
          <button type="button" id="logout-link"
            style="background:none;border:none;color:var(--color-accent);text-decoration:underline;cursor:pointer;font-size:0.85rem;margin-left:0.5rem;">
            登出
          </button>
        </p>
      </div>

      <div id="new-profile-step" class="hidden">
        <h2 style="text-align:center;">新增帳號</h2>
        <label for="new-nickname">名字</label>
        <input type="text" id="new-nickname" maxlength="20" placeholder="輸入名字" />
        <!--
          選課本。兩個孩子各有各的單字庫，選錯的話他會一路練到別人的功課——
          而那件事從畫面上看不出來（單字都是英文，他不會知道那不是自己的）。
          所以放在建立帳號的時候問，而且是必選。
        -->
        <label for="new-bank">用哪一本單字庫</label>
        <div id="new-bank" class="bank-picker"></div>
        <p id="new-bank-note" class="muted" style="font-size:0.85rem; margin:0.3rem 0 0;"></p>
        <p class="error-text" id="new-profile-error"></p>
        <div style="display:flex; gap:0.75rem; margin-top:1rem; justify-content:center;">
          <button class="btn secondary" id="new-profile-cancel" type="button">取消</button>
          <button class="btn" id="new-profile-create" type="button">建立帳號</button>
        </div>
      </div>

      <div id="delete-profile-step" class="hidden">
        <h2 style="text-align:center;">刪除帳號</h2>
        <p style="text-align:center;">
          要刪掉 <strong id="delete-target-name"></strong> 嗎？<br />
          這個帳號的<strong>分數、金幣、練習進度</strong>都會不見，而且救不回來。
        </p>
        <p style="text-align:center; color: var(--color-text-muted); font-size:0.9rem;">
          單字錄音不會被刪掉——那是共用的，其他帳號還聽得到。
        </p>
        <label for="delete-confirm">確定的話，把名字再打一次</label>
        <input type="text" id="delete-confirm" maxlength="20" placeholder="輸入要刪除的名字" />
        <p class="error-text" id="delete-error"></p>
        <div style="display:flex; gap:0.75rem; margin-top:1rem; justify-content:center;">
          <button class="btn secondary" id="delete-cancel" type="button">取消</button>
          <button class="btn danger" id="delete-confirm-btn" type="button">確定刪除</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
  <script>
    // 保險：萬一 JS 模組完全載入失敗，仍要把內容顯示出來，避免永遠卡在載入畫面
    /* page-loading-failsafe */
    setTimeout(function () { document.body.classList.remove("page-loading"); }, 30000);
  </script>
</body>
</html>
