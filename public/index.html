<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拼字蜂 Spelling Bee</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body data-theme="sports" class="page-loading">
  <div class="center-column">
    <div class="panel container" style="max-width: 480px;">
      <h1 class="display-font" style="text-align:center; color: var(--color-primary);">🐝 拼字蜂</h1>
      <p style="text-align:center; color: var(--color-text-muted);">選一個玩家開始練習！</p>

      <div id="profile-step">
        <div id="profile-grid" class="profile-grid">
          <!-- 動態填入 profile tiles -->
        </div>
        <p id="logged-in-hint" class="hidden" style="text-align:center; font-size:0.85rem; color:var(--color-text-muted);">
          目前登入：<strong id="logged-in-name"></strong>
          <button type="button" id="logout-link"
            style="background:none;border:none;color:var(--color-secondary);text-decoration:underline;cursor:pointer;font-size:0.85rem;">
            登出
          </button>
        </p>
      </div>

      <div id="pin-step" class="hidden">
        <h2 style="text-align:center;" id="pin-step-title">輸入 PIN 碼</h2>
        <div class="pin-dots" id="pin-dots">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="pin-pad" id="pin-pad">
          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button type="button" id="pin-back" class="wide">←</button>
          <button type="button" data-digit="0">0</button>
          <button type="button" id="pin-cancel" class="wide">取消</button>
        </div>
        <p class="error-text" id="pin-error"></p>
      </div>

      <div id="new-profile-step" class="hidden">
        <h2 style="text-align:center;">建立新玩家</h2>
        <label for="new-nickname">暱稱</label>
        <input type="text" id="new-nickname" maxlength="20" placeholder="輸入暱稱" />
        <p class="error-text" id="new-profile-error"></p>
        <div style="display:flex; gap:0.75rem; margin-top:1rem; justify-content:center;">
          <button class="btn secondary" id="new-profile-cancel" type="button">取消</button>
          <button class="btn" id="new-profile-next" type="button">下一步：設定 PIN</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
  <script>
    // 保險：萬一 JS 模組完全載入失敗，仍要把內容顯示出來，避免永遠卡在載入畫面
    /* page-loading-failsafe */
    setTimeout(function () { document.body.classList.remove("page-loading"); }, 30000);
  </script>
</body>
</html>
