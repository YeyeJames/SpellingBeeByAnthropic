<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>練習 - 拼字蜂</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/practice.css" />
  <!-- modulepreload:start 由 npm run gen-preload 產生，請勿手動編輯 -->
  <link rel="modulepreload" href="/js/practice.js" />
  <link rel="modulepreload" href="/js/api.js" />
  <link rel="modulepreload" href="/js/ui-status.js" />
  <link rel="modulepreload" href="/js/auth.js" />
  <link rel="modulepreload" href="/js/theme.js" />
  <link rel="modulepreload" href="/js/local-store.js" />
  <link rel="modulepreload" href="/js/nav-partial.js" />
  <link rel="modulepreload" href="/js/outbox.js" />
  <link rel="modulepreload" href="/js/sound-manager.js" />
  <link rel="modulepreload" href="/js/audio-player.js" />
  <link rel="modulepreload" href="/js/game/load-phaser.js" />
  <link rel="modulepreload" href="/js/shared/answer-match.js" />
  <link rel="modulepreload" href="/js/game/core/charset.js" />
  <!-- modulepreload:end -->
</head>
<body data-theme="sports" class="page-loading fullscreen-page">
  <div data-nav-mount></div>

  <div class="container">
    <div class="panel container" id="setup-panel">
      <h1>🎧 聽寫練習</h1>

      <!--
        電腦上分兩欄：左邊選組別，右邊放設定與按鈕。

        原本是一長條 640px 置中，28 組排成 4 欄要 8 列，
        「開始練習」被擠到摺線以下——每次都要先捲頁才按得到，
        而那是這一頁唯一真正要按的東西。兩欄之後左右的空白也用上了。
        窄螢幕會自己收回成一欄（見 practice.css）。
      -->
      <div class="setup-columns">
        <div class="setup-main">
          <p class="setup-label">選擇要練習哪一組</p>
          <div id="part-picker" class="part-picker"></div>
        </div>

        <div class="setup-side">
          <p class="setup-label">出題順序</p>
          <div class="order-picker">
            <label><input type="radio" name="order" value="sequential" checked /> 📖 照順序</label>
            <label><input type="radio" name="order" value="random" /> 🎲 隨機</label>
          </div>

          <p class="setup-label">朗讀方式</p>
          <div class="order-picker">
            <label><input type="radio" name="readMode" value="word" checked /> 🔤 只唸單字</label>
            <label><input type="radio" name="readMode" value="competition" /> 🏆 競賽模式</label>
          </div>
          <p class="setup-hint">競賽模式會像真實比賽一樣：唸單字 → 用在例句中 → 再唸一次單字</p>

          <div class="setup-actions">
            <button class="btn gold" id="start-practice-btn" type="button">▶️ 開始練習</button>
            <button class="btn secondary hidden" id="review-practice-btn" type="button">📋 複習到期單字</button>
            <!--
              遊戲那邊有「← 回練習」，這邊本來卻沒有路回去，等於只能單向走。
              而且要把選好的組帶過去——不然他得在遊戲裡再選一次。
            -->
            <button class="btn secondary" id="go-game-btn" type="button">🐝 玩遊戲</button>
          </div>
          <p class="error-text" id="setup-error"></p>
        </div>
      </div>
    </div>

    <div class="panel container hidden" id="practice-panel">
      <div class="practice-topbar">
        <span id="progress-label" class="display-font">1 / 25</span>
        <!--
          「這一回賺到的」，不是存款總數。

          原本兩邊都寫成「🪙 N」：上面導覽列那個是存款總數，這個只算這一回、
          每次練習都從 0 開始。長得一模一樣，他就把這個當成存款，
          練了三次看到的數字都差不多，於是問「錢怎麼還是只有 300」。
          加上「本回」兩個字，兩個數字才分得開。
        -->
        <span class="coin-badge" id="session-coin-badge">本回 🪙 0</span>
      </div>
      <div id="game-container"></div>
      <!-- 聽力輔助：跟真實比賽一樣，選手可以要求再唸一次、放慢、或用在句子裡 -->
      <div id="listen-tools">
        <button class="tool-btn" id="replay-btn" type="button" title="再聽一次">🔊<span class="tool-label">再聽</span></button>
        <button class="tool-btn" id="slow-btn" type="button" title="慢慢唸">🐢<span class="tool-label">慢唸</span></button>
        <button class="tool-btn" id="sentence-btn" type="button" title="用在句子裡">💬<span class="tool-label">例句</span></button>
      </div>
      <div id="answer-area">
        <input type="text" id="answer-input" placeholder="拼拼看…" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="btn gold" id="submit-answer-btn" type="button">送出</button>
      </div>
      <div id="reveal-panel" class="hidden">
        <p class="reveal-result" id="reveal-result"></p>
        <p class="reveal-english" id="reveal-english"></p>
        <p class="reveal-chinese" id="reveal-chinese"></p>
        <p class="reveal-sentence" id="reveal-sentence"></p>
        <button class="btn" id="next-btn" type="button">下一題 ➡️</button>
      </div>
    </div>

    <div class="panel container hidden" id="summary-panel">
      <h2 class="display-font">🏁 完成！</h2>
      <p id="summary-text"></p>
      <button class="btn gold" id="play-again-btn" type="button">再玩一次</button>
    </div>
  </div>

  <script type="module" src="/js/practice.js"></script>
  <script>
    // 保險：萬一 JS 模組完全載入失敗，仍要把內容顯示出來，避免永遠卡在載入畫面
    /* page-loading-failsafe */
    setTimeout(function () { document.body.classList.remove("page-loading"); }, 30000);
  </script>
</body>
</html>
