<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的檔案 - 拼字蜂</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <!-- modulepreload:start 由 npm run gen-preload 產生，請勿手動編輯 -->
  <link rel="modulepreload" href="/js/profile.js" />
  <link rel="modulepreload" href="/js/api.js" />
  <link rel="modulepreload" href="/js/ui-status.js" />
  <link rel="modulepreload" href="/js/auth.js" />
  <link rel="modulepreload" href="/js/theme.js" />
  <link rel="modulepreload" href="/js/local-store.js" />
  <link rel="modulepreload" href="/js/nav-partial.js" />
  <link rel="modulepreload" href="/js/outbox.js" />
  <link rel="modulepreload" href="/js/sound-manager.js" />
  <link rel="modulepreload" href="/js/audio-player.js" />
  <!-- modulepreload:end -->
</head>
<body data-theme="sports" class="page-loading">
  <div data-nav-mount></div>

  <div class="container">
    <div class="panel container">
      <h1>🏆 我的檔案</h1>

      <div class="profile-top">
        <div id="avatar-preview" class="avatar-preview"></div>
        <div class="stats-grid" id="stats-grid"></div>
      </div>

      <h2>🎨 主題</h2>
      <div id="theme-switcher" class="theme-switcher"></div>

      <h2>🗣️ 英文發音</h2>
      <div class="voice-settings">
        <label>朗讀單字的語音
          <select id="voice-select"></select>
        </label>
        <p class="voice-hint" id="voice-hint">
          語音是由這台裝置提供的，所以設定只會套用在這台裝置上。
        </p>
        <button class="btn secondary" id="test-voice-btn" type="button">🔊 試聽</button>
      </div>

      <h2>🔊 音效設定</h2>
      <div class="audio-settings">
        <label>背景音樂音量
          <input type="range" id="bgm-volume" min="0" max="1" step="0.05" />
        </label>
        <label>音效音量
          <input type="range" id="sfx-volume" min="0" max="1" step="0.05" />
        </label>
        <label class="mute-row">
          <input type="checkbox" id="mute-toggle" />
          全部靜音
        </label>
        <button class="btn secondary" id="save-audio-btn" type="button">💾 儲存音效設定</button>
        <span class="error-text" id="audio-save-msg"></span>
      </div>
    </div>
  </div>

  <script type="module" src="/js/profile.js"></script>
  <script>
    // 保險：萬一 JS 模組完全載入失敗，仍要把內容顯示出來，避免永遠卡在載入畫面
    /* page-loading-failsafe */
    setTimeout(function () { document.body.classList.remove("page-loading"); }, 30000);
  </script>
</body>
</html>
