<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢保衛戰 - 拼字蜂</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/game.css" />
</head>
<body class="page-loading">
  <!-- 遊戲畫面沒有導覽列：遊戲就是遊戲，選單另外走 -->
  <div id="game-root"></div>

  <div id="game-chrome">
    <a class="chrome-link" href="/practice.html">← 回練習</a>
    <span id="seed-label" class="chrome-seed"></span>
    <!--
      目前難度一定要看得見，而且要能一鍵重測。
      同一台電腦會有不只一個人玩（爸爸測完換小孩），難度記住卻不顯示的話，
      下一個人會直接繼承上一個人的設定——慢手速用到挑戰難度是 100% 失敗率。
    -->
    <span id="difficulty-label" class="chrome-difficulty"></span>
    <button type="button" id="btn-recalibrate" class="chrome-btn">重測手速</button>
    <button type="button" id="btn-restart" class="chrome-btn">重開一場</button>
    <!-- 小孩覺得「剛剛怪怪的」就按這個，我拿到錄影檔就能完整重現 -->
    <button type="button" id="btn-replay-file" class="chrome-btn">剛剛怪怪的</button>
    <button type="button" id="btn-mute" class="chrome-btn">🔊 聲音</button>
    <a class="chrome-link" href="/selftest">聲音檢查</a>
    <span class="chrome-hint">↑再聽 ↓慢唸 →例句 · Esc 暫停 · F2 靜音 · F3 除錯</span>
  </div>

  <!-- 觸控裝置專用：桌機用方向鍵，這三顆只在有觸控時才顯示 -->
  <div id="listen-buttons">
    <button type="button" class="listen-btn" data-listen="replay">🔊 再聽</button>
    <button type="button" class="listen-btn" data-listen="slow">🐢 慢唸</button>
    <button type="button" class="listen-btn" data-listen="sentence">💬 例句</button>
  </div>

  <!--
    輸入法警告：停在注音模式時按字母會跳選字視窗，遊戲完全不能玩。
    小孩不會自己想到要切輸入法，所以直接把話講明白。
  -->
  <div id="ime-warning" hidden>
    <strong>請把輸入法切成英文</strong>
    <span>現在是中文輸入法，打出來的字母遊戲收不到。<br />按鍵盤上的切換鍵（通常是 Shift 或 Ctrl+空白鍵）換成英文再繼續。</span>
  </div>

  <!--
    校準：第一次玩時先量手速再建議難度。
    模擬顯示難度選錯的代價是災難性的（同一個孩子在 easy 10% 失敗率、
    在 hard 是 100%），所以不能讓他自己猜。
  -->
  <div id="calibrate" hidden>
    <strong>先量一下你打字有多快</strong>
    <p id="calibrate-prompt">把下面三個字打出來就好，不會扣血也不會輸。</p>
    <div id="calibrate-word"></div>
    <div id="calibrate-typed"></div>
    <div id="calibrate-progress"></div>

    <div id="calibrate-result" hidden>
      <p>建議難度：<span id="calibrate-label"></span></p>
      <p id="calibrate-detail"></p>
    </div>
    <div id="calibrate-choice" hidden>
      <button type="button" class="btn-difficulty" data-difficulty="easy">輕鬆</button>
      <button type="button" class="btn-difficulty" data-difficulty="normal">標準</button>
      <button type="button" class="btn-difficulty" data-difficulty="hard">挑戰</button>
    </div>
  </div>

  <!--
    觸控裝置沒有使用者的點擊就不會叫出螢幕鍵盤，等於完全不能打字。
    先擋一層「點一下開始」。
  -->
  <div id="tap-to-start" hidden>
    <strong>點一下開始</strong>
    <span>會叫出鍵盤，然後把螢幕上的單字打出來</span>
  </div>

  <p id="game-error" class="game-error"></p>

  <div id="loading-note">載入中…</div>

  <script type="module" src="/js/game.js"></script>
</body>
</html>
