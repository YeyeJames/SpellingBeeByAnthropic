<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢保衛戰 - 拼字蜂</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/game.css" />
</head>
<body class="page-loading">
  <!-- 遊戲畫面沒有導覽列：遊戲就是遊戲，選單另外走 -->
  <div id="game-root"></div>

  <div id="game-chrome">
    <a class="chrome-link" href="/practice.html">← 回練習</a>
    <span id="seed-label" class="chrome-seed"></span>
    <button type="button" id="btn-restart" class="chrome-btn">重開一場</button>
    <!-- 小孩覺得「剛剛怪怪的」就按這個，我拿到錄影檔就能完整重現 -->
    <button type="button" id="btn-replay-file" class="chrome-btn">剛剛怪怪的</button>
    <button type="button" id="btn-mute" class="chrome-btn">🔊 聲音</button>
    <span class="chrome-hint">↑再聽 ↓慢唸 →例句 · Esc 暫停 · F2 靜音 · F3 除錯</span>
  </div>

  <!-- 觸控裝置專用：桌機用方向鍵，這三顆只在有觸控時才顯示 -->
  <div id="listen-buttons">
    <button type="button" class="listen-btn" data-listen="replay">🔊 再聽</button>
    <button type="button" class="listen-btn" data-listen="slow">🐢 慢唸</button>
    <button type="button" class="listen-btn" data-listen="sentence">💬 例句</button>
  </div>

  <!--
    輸入法警告：停在注音模式時按字母會跳選字視窗，遊戲完全不能玩。
    小孩不會自己想到要切輸入法，所以直接把話講明白。
  -->
  <div id="ime-warning" hidden>
    <strong>請把輸入法切成英文</strong>
    <span>現在是中文輸入法，打出來的字母遊戲收不到。<br />按鍵盤上的切換鍵（通常是 Shift 或 Ctrl+空白鍵）換成英文再繼續。</span>
  </div>

  <!--
    觸控裝置沒有使用者的點擊就不會叫出螢幕鍵盤，等於完全不能打字。
    先擋一層「點一下開始」。
  -->
  <div id="tap-to-start" hidden>
    <strong>點一下開始</strong>
    <span>會叫出鍵盤，然後把螢幕上的單字打出來</span>
  </div>

  <p id="game-error" class="game-error"></p>

  <div id="loading-note">載入中…</div>

  <script type="module" src="/js/game.js"></script>
</body>
</html>
