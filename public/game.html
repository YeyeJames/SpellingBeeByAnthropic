<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢保衛戰 - 拼字蜂</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/game.css" />
</head>
<body class="page-loading">
  <!-- 遊戲畫面沒有導覽列：遊戲就是遊戲，選單另外走 -->
  <div id="game-root"></div>

  <div id="game-chrome">
    <!--
      第一排：現在練的是哪一組、打到哪了。
      這兩件事是玩的時候會一直瞄的，所以字級比下面那排大得多——
      擠在一堆按鈕中間用 0.82rem 寫，等於沒寫。
    -->
    <div class="chrome-status">
      <span id="group-label" class="chrome-group"></span>
      <span id="progress-label" class="chrome-progress"></span>
      <span id="difficulty-label" class="chrome-difficulty"></span>
    </div>

    <!-- 第二排：按鈕與提示，平常不會看，所以小一點 -->
    <div class="chrome-controls">
      <a class="chrome-link" href="/practice.html">← 回練習</a>
      <button type="button" id="btn-rules" class="chrome-btn chrome-btn-rules">❓ 玩法說明</button>
      <!--
        難度要能一鍵重測。同一台電腦會有不只一個人玩（爸爸測完換小孩），
        難度記住卻不重測的話，下一個人會直接繼承上一個人的設定——
        慢手速用到挑戰難度是 100% 失敗率。
      -->
      <button type="button" id="btn-recalibrate" class="chrome-btn">重測手速</button>
      <button type="button" id="btn-restart" class="chrome-btn">重開一場</button>
      <!-- 小孩覺得「剛剛怪怪的」就按這個，我拿到錄影檔就能完整重現 -->
      <button type="button" id="btn-replay-file" class="chrome-btn">剛剛怪怪的</button>
      <button type="button" id="btn-mute" class="chrome-btn">🔊 聲音</button>
      <a class="chrome-link" href="/selftest">聲音檢查</a>
      <span id="seed-label" class="chrome-seed"></span>
      <span class="chrome-hint">↑再聽 ↓慢唸 →例句 · Esc 暫停 · F1 說明 · F2 靜音 · F3 除錯</span>
    </div>
  </div>

  <!-- 觸控裝置專用：桌機用方向鍵，這三顆只在有觸控時才顯示 -->
  <div id="listen-buttons">
    <button type="button" class="listen-btn" data-listen="replay">🔊 再聽</button>
    <button type="button" class="listen-btn" data-listen="slow">🐢 慢唸</button>
    <button type="button" class="listen-btn" data-listen="sentence">💬 例句</button>
  </div>

  <!--
    輸入法警告：停在注音模式時按字母會跳選字視窗，遊戲完全不能玩。
    小孩不會自己想到要切輸入法，所以直接把話講明白。
  -->
  <div id="ime-warning" hidden>
    <strong>請把輸入法切成英文</strong>
    <span>現在是中文輸入法，打出來的字母遊戲收不到。<br />按鍵盤上的切換鍵（通常是 Shift 或 Ctrl+空白鍵）換成英文再繼續。</span>
  </div>

  <!--
    校準：第一次玩時先量手速再建議難度。
    模擬顯示難度選錯的代價是災難性的（同一個孩子在 easy 10% 失敗率、
    在 hard 是 100%），所以不能讓他自己猜。
  -->
  <div id="calibrate" hidden>
    <strong>先量一下你打字有多快</strong>
    <p id="calibrate-prompt">把下面三個字打出來就好，不會扣血也不會輸。</p>
    <div id="calibrate-word"></div>
    <div id="calibrate-typed"></div>
    <div id="calibrate-progress"></div>

    <div id="calibrate-result" hidden>
      <p>建議難度：<span id="calibrate-label"></span></p>
      <p id="calibrate-detail"></p>
    </div>
    <div id="calibrate-choice" hidden>
      <button type="button" class="btn-difficulty" data-difficulty="easy">輕鬆</button>
      <button type="button" class="btn-difficulty" data-difficulty="normal">標準</button>
      <button type="button" class="btn-difficulty" data-difficulty="hard">挑戰</button>
    </div>
  </div>

  <!--
    開場畫面：先告訴他這一場是什麼，再讓他決定出題順序。
    兩顆按鈕本身就是「開始」——多一個確認鍵對小孩只是多一次點擊。
    網址帶 order= 時整個跳過（自動化測試靠這個，跟難度的規則一樣）。
  -->
  <div id="pregame" hidden>
    <strong id="pregame-group"></strong>
    <p id="pregame-count"></p>
    <!-- 最容易誤會的三件事，每一場都會看到一次 -->
    <div id="pregame-rules"></div>
    <p class="pregame-hint">要照課本順序，還是打亂？</p>
    <div id="pregame-order">
      <button type="button" class="btn-order" data-order="sequential">照順序</button>
      <button type="button" class="btn-order" data-order="random">打亂</button>
    </div>
  </div>

  <!--
    觸控裝置沒有使用者的點擊就不會叫出螢幕鍵盤，等於完全不能打字。
    先擋一層「點一下開始」。
  -->
  <div id="tap-to-start" hidden>
    <strong>點一下開始</strong>
    <span>會叫出鍵盤，然後把螢幕上的單字打出來</span>
  </div>

  <!--
    還沒解鎖的組別。
    遊戲模式是考試，練習模式才看得到中文、例句與正確拼法——
    所以同一組要先在練習模式完整做完兩次才玩得到。
    這一塊不是死路：直接給一顆按鈕帶他去練習。
  -->
  <div id="locked-panel" hidden>
    <strong>🔒 <span id="locked-group"></span>還沒解鎖</strong>
    <p id="locked-detail"></p>
    <p class="pregame-hint">先在練習模式把整組做完，看過中文跟例句再來玩。</p>
    <!-- 樣式跟開場那兩顆一樣，但不共用 class：那個 class 是「選出題順序」的按鈕 -->
    <a class="btn-locked-back" href="/practice.html">去練習模式</a>
  </div>

  <!--
    玩法說明。
    內容由 js/game/rules.js 從 balance.js 現場算出來——數字寫死在這裡的話，
    平衡一調說明就變成謊言，而且不會有任何錯誤，他只會照著過時的說明玩。
    字級刻意開大：這是要給小四生看的，擠成一團等於沒寫。
  -->
  <div id="rules-panel" hidden>
    <div class="rules-box">
      <h2>🐝 蜂巢保衛戰・玩法說明</h2>
      <div id="rules-body"></div>
      <button type="button" id="rules-close" class="btn-rules-close">知道了（Esc 或 F1 關閉）</button>
    </div>
  </div>

  <p id="game-error" class="game-error"></p>

  <div id="loading-note">載入中…</div>

  <script type="module" src="/js/game.js"></script>
</body>
</html>
