<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商店 - 拼字蜂</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/shop.css" />
  <!-- modulepreload:start 由 npm run gen-preload 產生，請勿手動編輯 -->
  <link rel="modulepreload" href="/js/shop.js" />
  <link rel="modulepreload" href="/js/api.js" />
  <link rel="modulepreload" href="/js/ui-status.js" />
  <link rel="modulepreload" href="/js/auth.js" />
  <link rel="modulepreload" href="/js/theme.js" />
  <link rel="modulepreload" href="/js/local-store.js" />
  <link rel="modulepreload" href="/js/nav-partial.js" />
  <link rel="modulepreload" href="/js/outbox.js" />
  <link rel="modulepreload" href="/js/sound-manager.js" />
  <link rel="modulepreload" href="/js/game/load-phaser.js" />
  <!-- modulepreload:end -->
</head>
<body data-theme="sports" class="page-loading">
  <div data-nav-mount></div>

  <div class="container">
    <div class="panel container">
      <h1>🛒 商店</h1>
      <p class="error-text" id="shop-error"></p>
      <div id="shop-grid" class="shop-grid"></div>
    </div>
  </div>

  <div id="minigame-overlay" class="shop-overlay hidden">
    <div class="panel minigame-panel">
      <h2>🪙 接金幣小遊戲</h2>
      <p>用滑鼠移動或方向鍵左右移動拼字蜂，接住掉下來的金幣！30 秒倒數。</p>
      <div id="minigame-container"></div>
      <p id="minigame-result" class="display-font" style="text-align:center;"></p>
      <div style="text-align:center; margin-top:1rem;">
        <button class="btn secondary" id="close-minigame-btn" type="button">關閉</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/shop.js"></script>
  <script>
    // 保險：萬一 JS 模組完全載入失敗，仍要把內容顯示出來，避免永遠卡在載入畫面
    /* page-loading-failsafe */
    setTimeout(function () { document.body.classList.remove("page-loading"); }, 30000);
  </script>
</body>
</html>
